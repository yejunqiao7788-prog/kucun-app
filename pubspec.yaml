name: kucun_app
description: "TorgSeek库存 —— 原生 Flutter 客户端，直连生产 /api/business 与 Supabase Auth"
publish_to: "none"
version: 2.1.9+22

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.10.0
  provider: ^6.1.2
  http: ^1.5.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  speech_to_text: ^7.1.0
  url_launcher: ^6.3.1
  record: ^7.1.2
  file_picker: ^13.3.0
  excel: ^4.0.6
  # 读商户 xlsx 要自己拆 zip（package:excel 读样式会对内置 numFmtId 抛异常，见
  # product_sheet.dart），这两个都在 excel 的依赖树里，这里只是提到直接依赖。
  archive: ^3.6.1
  xml: ^6.6.1
  # 拍照录单的兜底重编：image_picker 压不进 3.5 MB 上限时，在 isolate 里走质量阶梯。
  # 它本来就在依赖树里（excel 带进来），这里只是提到直接依赖。
  image: ^4.3.0
  printing: ^5.14.3
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app_icon.png
    # 单据 PDF 需要自带字形：pdf 引擎不吃系统字体。Noto Sans 管拉丁/西里尔/越南文两个
    # 字重，Noto Sans SC 只做汉字兜底。
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansSC-Regular.ttf
