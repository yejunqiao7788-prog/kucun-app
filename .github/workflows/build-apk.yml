name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.9
          name: "TorgSeek库存 v2.1.9"
          body: "SKU 成为每一面的主标识：商品、库存、订单明细、拍照复核、备货清单、集市与展厅，码的字号一律不小于名称，等宽半粗、不再压成灰色小字 —— 拣货要照着找货的那个码，此前在单据上比名称还小半号、还发灰。设置 →「打印与显示」新增「显示商品名称」：关掉后这些作业面与打印单据只剩码，名称仍可用于搜索、导入导出与买家页面；名称与 SKU 不能同时关掉（服务端同样拦这一条）。打印单据的名称列可整列消失，类目徽章跟着搬到 SKU 格，合计行按新列数补格，16 种开关组合逐格对账过。备货清单每单补上 SKU 摘要（前三个 + 还剩几项），码由服务端随备货队列一起下发。订单列表仍只有单号与客户，不铺码。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
