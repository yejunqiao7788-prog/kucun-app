name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.10
          name: "TorgSeek库存 v2.1.10"
          body: "订单完成后不再挂在备货清单：定稿即完成的单不会再被写进备货队列 —— 这一条现在由服务端统一裁决，网页端与 App 不再各记一份规则；订单详情里的拣货进度也只对未完成的单显示。首页「备货清单」只列真正待拣的单，队列为空时显示「没有需要备货的订单」，不再拿今日订单凑数。订单状态的文案与网页端对齐：待办那档叫「备货中」，此前误叫「草稿」。既有已完成却还带着备货开关的历史单，会在服务端读侧过滤上线后自动消失。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
