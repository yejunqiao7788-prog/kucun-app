name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.7
          name: "TorgSeek库存 v2.1.7"
          body: "「我的」顶部不再常驻付费位：还剩 30 天以上到期时，这一页不摆订阅价目表，也不再每次进来都发一次用不上的价目请求；到 30 天内（口径与服务端 expiring_30d 一致）才出现续费卡，副标题直接说「还剩 N 天到期」，已到期仍是唯一的解锁入口。账号卡上的订阅状态与到期时间照常保留，价目表与续费入口仍在财务 → 钱包与订阅，AI 钱包那部分没动。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
