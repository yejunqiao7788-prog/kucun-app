name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.6
          name: "TorgSeek库存 v2.1.6"
          body: "商品表格导入修好：商户的 .xlsx 一律报「文件为空或格式不正确」—— package:excel 读样式表时，遇到 Excel/WPS 写进去的内置会计格式（带 ￥ 那几套）直接抛异常，现在改成自己拆 zip 读单元格值，样式不看。空着不写的单元格按列引用对齐，价格留空不会再串到成本列；「忽略 N 行」的计数不再被截成 8。预览加上分类，并按网页端提前标出文件内重复的 SKU（这些行服务端一定会被拒）。箱规 > 1 才算整箱，与网页端一致。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
