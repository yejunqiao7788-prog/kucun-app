name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.4
          name: "TorgSeek库存 v2.1.4"
          body: "收款抽屉：找零不再一动不动 —— 旧写法把低于应收的差额钳成 0，少收了也只显示「找零 $0.00」；现按网页端规则实时派生三态（找零 / 收款后仍欠 / 正好结清）。数字框符号排版：符号与数字同字号同基线（此前小一号被居中，看着像上标），货币符号统一搬到数字左边（照网页端 prefixIcon），% 与单位仍留右边。首页动态：左栏换成动作图标块、商品名拿回整行宽度、逐字段变更摆成小块（超出报数）、价格成本按货币显示。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
