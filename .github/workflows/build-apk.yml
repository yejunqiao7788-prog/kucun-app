name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.14
          name: "TorgSeek库存 v2.1.14"
          body: "备货勾选提速：订单详情备货清单里点 +/- 标记，数字与勾号立即变化，保存在后台完成 —— 不再等一整趟网络往返，连点次次生效，两行分点互不阻塞（旧版一个保存在路上其它点击全被吞）。同一行的写按顺序排队防乱序；失败以服务端为准只回滚那一行。离线点按提示写入被挡、数字不动。服务端与网页端零改动，与主项目 OrderDetail.tsx 同一套乐观更新形状。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
