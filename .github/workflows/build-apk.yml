name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.5
          name: "TorgSeek库存 v2.1.5"
          body: "首页动态：批量改价、外部同步、保留期清理这三类记录不再只显示一个破折号 —— 服务端这几支既不写 changes 也不写商品名，网页端同样读不出内容，现在从 details 的参数与计数直接读出干了什么（方式与数值、共几件、更新/无变化/失败、新增 SKU 数、售价取自哪列、软删/硬删）。逐字段变更不再截断成三条，全部摆开；动态条数 6 → 10。金额档带货币符号，百分比档带 %。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
