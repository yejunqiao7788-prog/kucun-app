name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.11
          name: "TorgSeek库存 v2.1.11"
          body: "AI 助手改成只有本地查询一条通道：问答模式整条撤掉 —— 超管配的线上模型现在只服务订单拍照识别的图片识别，助手不再向上游发请求。页面重排：标题右侧一枚「本地查询」胶囊，查询后长出「重新查询」和「清空」；六个快捷查询连同录音转写一起搬到正文最上方自己折行（原来挂在输入框上方，要左右滑才看得全），下面依次是错误条、正在查询、空态与结果。手打的字同样走本地引擎，认不出才回「没查到」。语音两条通道都保留，转写或听写出来的字直接进查询，不用再按发送。查到的都是系统里的真实记录：库存、订单、操作日志，不经过任何模型。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
