name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: torgseek-kucun-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.1.8
          name: "TorgSeek库存 v2.1.8"
          body: "集市 → 分析页的留资砖补上「已回复」：过去这一格只写「总留资 · 待处理」，卖家看不出自己答过几条。服务端这次把留资首响的口径收口 —— 点已成交/已拒绝同样算回答，集市留资生成的订单做完也算回答 —— 这个数字第一次可信，于是并进数值行，转化率脚注与其它砖没动。集市投放 CPL 的报价也在校准（成交样本按货币面额分桶，不再把 $ 与 ₴ 混进同一个中位），单价由服务端算好下发，App 侧无需改动。"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
